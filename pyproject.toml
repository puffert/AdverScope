[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adverscope"
dynamic = ["version"]
description = "Local-first, model-assisted security assessment workbench for AI systems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "AdverScope contributors" }]
keywords = ["ai-security", "llm-security", "pentesting", "owasp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
adverscope = "osai_security.cli:main"

[project.optional-dependencies]
qualification = ["mcp==1.28.1"]
training = [
  "accelerate>=1.10,<2",
  "bitsandbytes>=0.47,<1",
  "datasets>=4,<5",
  "peft>=0.17,<1",
  "torch>=2.7,<3",
  "transformers>=4.57,<6",
  "trl>=0.23,<1",
]

[tool.setuptools.package-data]
osai_security = ["static/*"]

[tool.setuptools.packages.find]
include = ["osai_security*"]

[tool.setuptools.dynamic]
version = {attr = "osai_security.__version__"}

[tool.unittest]
start-directory = "tests"
